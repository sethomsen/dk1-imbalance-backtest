[project]
name = "dk1"
version = "0.1.0"
description = "Backtest of day-ahead vs imbalance positions in the Danish DK1 power market"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "holidays>=0.60",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dk1"]
